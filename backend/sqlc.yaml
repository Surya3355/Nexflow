# sqlc: typed Go code from SQL (docs/tech-stack.md). The schema is the
# migrations folder; golang-migrate *.down.sql files are ignored by sqlc.
# Each module adds one entry under sql: with its queries folder and output
# package. Generated code is committed; regenerate with `sqlc generate`.
version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "modules/access/queries"
    gen:
      go:
        package: "accessdb"
        out: "modules/access/accessdb"
        sql_package: "pgx/v5"
  - engine: "postgresql"
    schema: "migrations"
    queries: "modules/workflows/queries"
    gen:
      go:
        package: "workflowsdb"
        out: "modules/workflows/workflowsdb"
        sql_package: "pgx/v5"

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Browser security settings (spec 2026-11-27-hardening §4.5). Locations
  # below add no headers of their own, so these apply to every response.
  # Only this site's own scripts, styles, images and API; no framing by others.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  # Turn on once the site is served over HTTPS (hosting round):
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # The API runs in the "backend" service of docker-compose.yml.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $http_host;   # with the port, to match the browser's Origin
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 11m;
  }

  # Single-page app: unknown paths return index.html.
  location / {
    try_files $uri /index.html;
  }
}

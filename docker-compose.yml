# Local run of Nexflow: PostgreSQL, API and web app.
#   cp .env.example .env   (then set NEXFLOW_LINK_SECRET to 32+ random characters)
#   docker compose up --build
#   open http://localhost:8081
# Local development only. The database password here is not for production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nexflow
      POSTGRES_PASSWORD: nexflow-local
      POSTGRES_DB: nexflow
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexflow -d nexflow"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEXFLOW_DB_URL: postgres://nexflow:nexflow-local@db:5432/nexflow?sslmode=disable
      NEXFLOW_HTTP_ADDR: ":8080"
      NEXFLOW_LINK_SECRET: ${NEXFLOW_LINK_SECRET:?set NEXFLOW_LINK_SECRET in .env}
      NEXFLOW_UPLOAD_DIR: /data/uploads
      NEXFLOW_INSECURE_COOKIES: "true"   # plain HTTP on localhost only
      NEXFLOW_TRUST_PROXY: "true"        # login limit reads X-Real-IP from nginx
    volumes:
      - uploads:/data/uploads
    ports:
      - "8080:8080"
    healthcheck:
      # The image has no shell; the binary checks its own /healthz (database included).
      test: ["CMD", "/nexflow", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    stop_grace_period: 35s   # the server waits up to 30 s for work in progress

  web:
    build: ./web
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8081:80"

  # Runs the Go test suite against the compose database: docker compose run --rm test
  test:
    profiles: ["test"]   # not started by `docker compose up`
    build:
      context: ./backend
      target: test
      additional_contexts:
        infra: ./infra
    depends_on:
      db:
        condition: service_healthy
    environment:
      NEXFLOW_TEST_DB_URL: postgres://nexflow:nexflow-local@db:5432/postgres?sslmode=disable
      NEXFLOW_LINK_SECRET: local-test-secret-0123456789abcdef0123

volumes:
  dbdata:
  uploads:
